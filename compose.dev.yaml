name: haftsoo-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NUXT_APP_BASE_URL: /
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_DB: haftsoo
      POSTGRES_USER: haftsoo
      POSTGRES_PASSWORD: haftsoo-local-only
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    environment:
      CHAT_ADDRESS: ":3002"
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "/chat", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: haftsoo
      POSTGRES_USER: haftsoo
      POSTGRES_PASSWORD: haftsoo-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haftsoo -d haftsoo"]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  opensearch-data:
