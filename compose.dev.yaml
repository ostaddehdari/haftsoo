name: haftsoo-dev

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NUXT_APP_BASE_URL: /
      NUXT_PUBLIC_API_BASE: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    environment:
      CHAT_ADDRESS: ":3002"
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "/chat", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
