server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /haftsoo {
        return 308 /haftsoo/;
    }

    location /haftsoo/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /haftsoo/index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}

