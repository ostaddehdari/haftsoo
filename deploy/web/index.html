<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a62626">
  <title>هفت‌سو | بازارگاه آگهی ایران</title>
  <style>
    :root{color-scheme:dark;--bg:#18181b;--card:#242427;--text:#fafafa;--muted:#a1a1aa;--brand:#d33c3c;--line:#3f3f46}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#2f2020 0,var(--bg) 42%);color:var(--text);font-family:Tahoma,Arial,sans-serif}
    main{width:min(92vw,680px);padding:48px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--card) 92%,transparent);box-shadow:0 28px 80px #0008}
    .logo{display:grid;place-items:center;width:72px;height:72px;border-radius:22px;background:var(--brand);font-size:34px;font-weight:700;box-shadow:0 12px 32px #d33c3c45}
    h1{margin:28px 0 10px;font-size:clamp(30px,6vw,50px)}p{color:var(--muted);font-size:17px;line-height:2;margin:0}
    .status{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);font-size:14px;color:#86efac}.dot{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 6px #22c55e20}
    code{direction:ltr;display:inline-block;color:#fda4af}
    @media(max-width:560px){main{padding:28px;border-radius:18px}.logo{width:60px;height:60px;border-radius:18px}}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">هـ</div>
    <h1>هفت‌سو</h1>
    <p>زیرساخت استقرار هفت‌سو آماده است. رابط Nuxt، API مبتنی بر NestJS و سرویس چت Go در استیج‌های بعدی به همین محیط متصل می‌شوند.</p>
    <div class="status"><span class="dot"></span><span>استیج ۱ با موفقیت مستقر شد — <code>/haftsoo/</code></span></div>
  </main>
</body>
</html>
