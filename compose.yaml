name: haftsoo

services:
  web:
    image: nginx:1.27-alpine
    container_name: haftsoo-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:8080"
    volumes:
      - ./deploy/web:/usr/share/nginx/html/haftsoo:ro
      - ./deploy/nginx/container.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m

