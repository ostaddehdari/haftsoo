name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node monorepo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shell scripts
        run: >-
          bash -n install.sh scripts/configure-nginx.sh scripts/update.sh
          scripts/build-stage-03.sh scripts/build-stage-04.sh scripts/build-stage-05.sh scripts/build-stage-06.sh scripts/build-stage-07.sh scripts/build-stage-08.sh scripts/build-stage-09.sh scripts/build-stage-10.sh scripts/build-stage-11.sh scripts/build-stage-12.sh
          scripts/build-stage-13.sh scripts/build-stage-14.sh scripts/manage-secrets.sh scripts/test-secrets.sh
          scripts/backup-postgres.sh scripts/recovery-drill.sh
      - name: Install frozen dependency graph
        run: npm ci --no-audit --no-fund
      - name: Verify stage evidence
        run: npm run verify:all
      - name: Validate database contracts
        run: npm run database:contract
      - name: Validate catalog contracts and fixture
        run: npm run catalog:contract && npm run catalog:validate
      - name: Validate geography contracts and fixture
        run: npm run geo:contract && npm run geo:validate
      - name: Validate national geography and visual QA report
        run: npm run geo:national:contract && npm run geo:national:qa
      - name: Validate search contracts and quality budgets
        run: npm run search:contract && npm run search:quality
      - name: Validate map and GIS contracts
        run: npm run map:contract
      - name: Validate submission wizard contracts
        run: npm run submission:contract
      - name: Lint and formatting
        run: npm run lint && npm run format:check
      - name: Typecheck, test and build workspaces
        run: npm run typecheck && npm run test && npm run build
      - name: Validate commit message
        if: github.event_name == 'push'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: npm run commitlint -- "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
      - name: Preserve generated dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: stage-14-package-lock
          path: package-lock.json
          retention-days: 7

  security:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frozen dependency graph
        run: npm ci --no-audit --no-fund
      - name: Verify machine-readable security policies
        run: npm run security:baseline
      - name: Run Nest security unit and HTTP tests
        run: npm run test:security

  go:
    name: Go chat service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: services/chat/go.mod
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath ./cmd/server

  compose:
    name: Container contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose -f compose.dev.yaml config --quiet
      - name: Validate staging topology
        run: |
          secret_directory="$(mktemp -d)"
          trap 'rm -rf "$secret_directory"' EXIT
          bash scripts/manage-secrets.sh bootstrap "$secret_directory"
          HAFTSOO_IMAGE_TAG=sha-000000000000 \
          HAFTSOO_SECRET_DIR="$secret_directory" \
            docker compose -f ops/compose/staging.yaml config --quiet
      - name: Validate Dockerfiles
        run: |
          docker build --check -f apps/web/Dockerfile .
          docker build --check -f apps/api/Dockerfile .
          docker build --check -f services/chat/Dockerfile .

  infrastructure:
    name: Infrastructure contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test secret lifecycle
        run: bash scripts/test-secrets.sh
      - name: Test capacity model
        run: node scripts/test-capacity.mjs
      - name: Validate Ansible syntax
        run: |
          python3 -m pip install --disable-pip-version-check ansible-core==2.19.3
          ansible-playbook --syntax-check \
            -i infra/ansible/inventory.example.ini \
            infra/ansible/site.yml

  recovery:
    name: PostGIS recovery drill
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore an isolated PostGIS backup
        run: bash scripts/recovery-drill.sh
